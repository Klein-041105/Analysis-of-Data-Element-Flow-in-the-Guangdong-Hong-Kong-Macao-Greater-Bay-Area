# 主配置文件 - 用于控制脚本行为
project:
  name: "粤港澳大湾区数据要素流动实验"
  version: "0.1.0"

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  external_dir: "data/external"

preprocessing:
  missing_strategy: "mice"   # options: mice, knn, time_series, autoencoder
  outlier_methods:
    - "grubbs"
    - "isolation_forest"
    - "lof"
  time_index: "year"  # could be year/month/day depending on dataset

analysis:
  start_year: 2019
  end_year: 2023
  cities:
    chinese: ["广州", "深圳", "珠海", "佛山", "惠州", "东莞", "中山", "江门", "肇庆", "澳门", "香港"]
    english: ["Guangzhou", "Shenzhen", "Zhuhai", "Foshan", "Huizhou", "Dongguan", "Zhongshan", "Jiangmen", "Zhaoqing", "Macau", "Hong Kong"]
    city_mappering:
      广州: Guangzhou
      深圳: Shenzhen
      珠海: Zhuhai
      佛山: Foshan
      惠州: Huizhou
      东莞: Dongguan
      中山: Zhongshan
      江门: Jiangmen
      肇庆: Zhaoqing
      澳门: Macau
      香港: Hong Kong
logging:
  level: "INFO"
  log_dir: "logs"
