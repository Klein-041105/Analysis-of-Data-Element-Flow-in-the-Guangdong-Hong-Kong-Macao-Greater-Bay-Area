  - numpy>=1.25.0
  - scipy>=1.11.0
  - scikit-learn>=1.3.0
  - statsmodels>=0.14.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - geopandas>=0.13.0
  - pysal>=4.7.0
